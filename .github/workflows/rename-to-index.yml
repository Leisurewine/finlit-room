name: Rename space-3.html to index.html
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rename-to-index.yml
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename space-3.html to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv space-3.html index.html
          git commit -m "Rename space-3.html to index.html"
          git push
